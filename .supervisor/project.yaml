schema_version: 1
project_id: tuya-zigbee-switch
repo: analienx/tuya-zigbee-switch
repository_visibility: public
lifecycle: active

execution:
  schema_version: 1
  default_mode: github_actions
  optional_modes: []
  build_lane: GitHub-hosted Actions only; exact candidate SHA
  host_specialist: explicit-user-authorized USB/device operations only; never build/test/verify

canonical_skill:
  source: external_github
  repo: analienx/config
  ref: main
  path: skills/supervisor-executor/SKILL.md

capability_policy:
  source: external_github
  repo: analienx/config
  ref: main
  path: skills/supervisor-executor/CAPABILITY_PROFILES.md

registry:
  source: external_github
  repo: analienx/config
  ref: main
  path: supervisor/projects.yaml

context:
  project_readme: ROMASKU_ORIGINAL_README.md
  firmware_sources: src
  tests: tests
  firmware_fast_path:
    repo: analienx/config
    ref: main
    path: skills/supervisor-executor/FIRMWARE_FAST_PATH.md

control:
  primary_issue: 55

executor:
  environment: github_hosted_actions
  runtime: github_actions
  objective_mode: direct
  interface: github_actions
  management_paths:
    - github_actions

mutation_policy:
  typed_host_actions:
    - usb.attach
    - usb.detach
  physical_device_mutation_requires_explicit_scope: true

secrets:
  policy: never_print

user_shorthand:
  ".": supervise_latest
