name: BSEED PM reproducibility

on:
  workflow_dispatch:
  pull_request:

jobs:
  validate-unified-pm:
    # This is the integration-branch release gate. The workflow remains
    # dispatchable after merge for explicit future reproducibility checks.
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'assistant/v8-unified-pm'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make python3 python3-pytest python3-yaml curl wget unzip bzip2

      - name: Cache Telink SDK and toolchain
        uses: actions/cache@v4
        with:
          path: telink_tools
          key: telink-tools-v3.7.2.0

      - name: Install Telink build dependencies only
        run: make -C src/telink -f tools.mk sdk toolchain

      - name: Record build environment
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "head=$(git rev-parse HEAD)"
            echo "status_begin"
            git status --porcelain
            echo "status_end"
            echo "python=$(python3 --version 2>&1)"
            echo "make=$(make --version | head -1)"
            ./telink_tools/toolchain/bin/tc32-elf-gcc --version | head -1 || true
            sha256sum telink_tools/downloads/tc32_gcc_v2.0.tar.bz2 || true
          } > "$RUNNER_TEMP/pm-build-environment.txt"

      - name: Validate unified PM and TS0726 from same SHA
        shell: bash
        run: |
          set -euo pipefail
          python3 make_scripts/validate_bseed_ts011f_pm_v8.py 2>&1 | tee "$RUNNER_TEMP/pm-validator-output.log"

      - name: Upload deterministic build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bseed-pm-v8-reproducibility
          path: |
            ${{ runner.temp }}/pm-validator-output.log
            ${{ runner.temp }}/pm-build-environment.txt
            build/bseed-ts011f-pm-v8/forward.bin
            build/bseed-ts011f-pm-v8/forward.ota
            build/bseed-ts011f-pm-v8/manifest.json
            build/bseed-ts0726-v8/forward.bin
            build/bseed-ts0726-v8/forward.ota
            build/bseed-ts0726-v8/manifest.json
          if-no-files-found: warn
