name: Validate v5 against ZHC 26.90.0

on:
  push:
    branches:
      - supervisor/target-overlay-v5
    paths:
      - zigbee2mqtt/converters/bseed_ts0726_v5.js
      - helper_scripts/probe_bseed_ts0726_v5_installed_zhc.js
      - .github/workflows/validate-v5-zhc-2690.yml

permissions:
  contents: read

jobs:
  exact-zhc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install exact live converter package in isolated directory
        run: |
          mkdir -p /tmp/bseed-zhc-check
          cd /tmp/bseed-zhc-check
          npm init -y
          npm install --no-audit --no-fund zigbee-herdsman-converters@26.90.0
      - name: Probe processed exposes and configure surface
        run: |
          cd /tmp/bseed-zhc-check
          node "$GITHUB_WORKSPACE/helper_scripts/probe_bseed_ts0726_v5_installed_zhc.js"             "$GITHUB_WORKSPACE/zigbee2mqtt/converters/bseed_ts0726_v5.js"
