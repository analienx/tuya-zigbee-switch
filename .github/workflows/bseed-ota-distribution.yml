name: BSEED OTA distribution

on:
  push:
    branches:
      - supervisor/bseed-tuya-conversion
    paths-ignore:
      - 'zigbee2mqtt/ota/bseed/**'
      - 'zigbee2mqtt/ota/index_bseed.json'
      - 'zigbee2mqtt/ota/index_router.json'
      - 'zigbee2mqtt/ota/index_router-FORCE.json'
      - 'device_db.yaml'
      - 'docs/supported_devices.md'
  pull_request:

permissions:
  contents: write

env:
  BSEED_PM_VERSION_HEX: '12053007'
  BSEED_PM_VERSION_DEC: '302329863'
  BSEED_PM_RELEASE: 'v8u4'
  BSEED_NONPM_VERSION_DEC: '285356033'

jobs:
  build-bseed-distribution:
    if: github.event_name == 'push' || github.head_ref == 'supervisor/bseed-tuya-conversion'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make python3 python3-pytest python3-yaml python3-jinja2 curl wget unzip bzip2

      - name: Cache Telink SDK and toolchain
        uses: actions/cache@v4
        with:
          path: telink_tools
          key: telink-tools-v3.7.2.0

      - name: Install pinned Telink build dependencies
        run: make -C src/telink -f tools.mk sdk toolchain

      - name: Run conversion/index contract tests
        run: python3 -m pytest -q tests/test_bseed_tuya_conversion_release.py

      - name: Build PM and TS0726 normal plus from-Tuya images
        shell: bash
        run: |
          set -euo pipefail
          bash make_scripts/build_bseed_ts011f_pm_v8.sh
          bash make_scripts/build_bseed_ts0726_v8.sh

      - name: Stage PM-only public OTA release and preserve TS0726
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p zigbee2mqtt/ota/bseed

          # This release changes only the PM target. Preserve the already-public
          # TS0726 binaries and index entries byte-for-byte unless TS0726 gets its
          # own version bump and hardware-validation release.
          cp zigbee2mqtt/ota/index_bseed.json /tmp/index_bseed-before.json

          cp build/bseed-ts011f-pm-v8/forward.ota \
            "zigbee2mqtt/ota/bseed/ts011f-pm-v${BSEED_PM_VERSION_HEX}.ota"
          cp build/bseed-ts011f-pm-v8/from_tuya.ota \
            "zigbee2mqtt/ota/bseed/ts011f-pm-v${BSEED_PM_VERSION_HEX}-from_tuya.ota"

          python3 make_scripts/make_bseed_ota_index.py \
            --pm-dir build/bseed-ts011f-pm-v8 \
            --ts0726-dir build/bseed-ts0726-v8 \
            --output /tmp/index_bseed-generated.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          previous = json.loads(Path('/tmp/index_bseed-before.json').read_text())
          generated = json.loads(Path('/tmp/index_bseed-generated.json').read_text())

          pm_names = {'b28wrpvx', '_TZ3000_b28wrpvx'}
          ts0726_names = {'iedhxgyi', '_TZ3002_iedhxgyi'}
          nonpm_names = {'o1jzcxou', '_TZ3000_o1jzcxou'}

          pm_entries = [e for e in generated if e['manufacturerName'][0] in pm_names]
          ts0726_entries = [e for e in previous if e['manufacturerName'][0] in ts0726_names]
          nonpm_entries = [e for e in previous if e['manufacturerName'][0] in nonpm_names]
          assert len(pm_entries) == 2, pm_entries
          assert len(ts0726_entries) == 2, ts0726_entries
          assert len(nonpm_entries) in (0, 2), nonpm_entries

          out = pm_entries + nonpm_entries + ts0726_entries
          Path('zigbee2mqtt/ota/index_bseed.json').write_text(
              json.dumps(out, indent=2) + '\n', encoding='utf-8'
          )
          PY

          python3 make_scripts/merge_bseed_ota_indexes.py \
            --bseed-index zigbee2mqtt/ota/index_bseed.json \
            --router-index zigbee2mqtt/ota/index_router.json \
            --force-index zigbee2mqtt/ota/index_router-FORCE.json

      - name: Update supported-device status from exact target block
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('device_db.yaml')
          text = path.read_text(encoding='utf-8')
          start = text.index('OUTLET_BSEED_PM_TS011F:\n')
          end = text.index('\nOUTLET_BSEED_PM_TS011F_1:', start)
          section = text[start:end]
          old = '  status: in_progress\n  info: Power monitoring not implemented\n'
          new = '  status: fully_supported\n  info: Supported (BL0937 power monitoring)\n'
          if old not in section:
              if new not in section:
                  raise SystemExit('unexpected OUTLET_BSEED_PM_TS011F status block')
          else:
              section = section.replace(old, new, 1)
              text = text[:start] + section + text[end:]
              path.write_text(text, encoding='utf-8')
          PY
          python3 helper_scripts/make_supported_devices.py device_db.yaml > docs/supported_devices.md

      - name: Validate staged distribution
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import yaml

          entries = json.loads(Path('zigbee2mqtt/ota/index_bseed.json').read_text())
          previous = json.loads(Path('/tmp/index_bseed-before.json').read_text())
          assert len(entries) in (4, 6)
          pm_version = int(os.environ['BSEED_PM_VERSION_DEC'])
          nonpm_version = int(os.environ['BSEED_NONPM_VERSION_DEC'])
          expected = {
              ('b28wrpvx', 43556, pm_version),
              ('_TZ3000_b28wrpvx', 54179, 0xFFFFFFFF),
              ('iedhxgyi', 45577, 0x1102300A),
              ('_TZ3002_iedhxgyi', 54179, 0xFFFFFFFF),
          }
          actual = {(e['manufacturerName'][0], e['imageType'], e['fileVersion']) for e in entries}
          if len(entries) == 6:
              expected |= {
                  ('o1jzcxou', 43555, nonpm_version),
                  ('_TZ3000_o1jzcxou', 54179, 0xFFFFFFFF),
              }
          assert actual == expected

          old_ts = {
              e['manufacturerName'][0]: e
              for e in previous
              if e['manufacturerName'][0] in {'iedhxgyi', '_TZ3002_iedhxgyi'}
          }
          new_ts = {
              e['manufacturerName'][0]: e
              for e in entries
              if e['manufacturerName'][0] in {'iedhxgyi', '_TZ3002_iedhxgyi'}
          }
          assert new_ts == old_ts, 'PM-only release changed TS0726 index entries'

          for entry in entries:
              path = Path('zigbee2mqtt/ota/bseed') / entry['fileName']
              data = path.read_bytes()
              assert len(data) == entry['fileSize']
              assert hashlib.sha512(data).hexdigest() == entry['sha512']
              assert entry['url'].endswith('/' + entry['fileName'])

          db = yaml.safe_load(Path('device_db.yaml').read_text())
          pm = db['OUTLET_BSEED_PM_TS011F']
          assert pm['status'] == 'fully_supported'
          assert pm['stock_manufacturer_name'] == '_TZ3000_b28wrpvx'
          assert pm['stock_image_type'] == 54179
          assert pm['firmware_image_type'] == 43556
          PY

      - name: Upload immutable distribution evidence
        uses: actions/upload-artifact@v4
        with:
          name: bseed-${{ env.BSEED_PM_RELEASE }}-ota-distribution
          path: |
            build/bseed-ts011f-pm-v8/forward.bin
            build/bseed-ts011f-pm-v8/forward.ota
            build/bseed-ts011f-pm-v8/from_tuya.ota
            build/bseed-ts011f-pm-v8/manifest.json
            build/bseed-ts0726-v8/forward.bin
            build/bseed-ts0726-v8/forward.ota
            build/bseed-ts0726-v8/from_tuya.ota
            build/bseed-ts0726-v8/manifest.json
            zigbee2mqtt/ota/index_bseed.json
            zigbee2mqtt/ota/bseed/
          if-no-files-found: error

      - name: Commit only Actions-built public distribution files
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            device_db.yaml \
            docs/supported_devices.md \
            zigbee2mqtt/ota/bseed \
            zigbee2mqtt/ota/index_bseed.json \
            zigbee2mqtt/ota/index_router.json \
            zigbee2mqtt/ota/index_router-FORCE.json
          if git diff --cached --quiet; then
            echo 'No generated distribution changes to commit.'
            exit 0
          fi
          git commit -m 'Publish Actions-built BSEED OTA distribution'
          git push origin HEAD:supervisor/bseed-tuya-conversion
