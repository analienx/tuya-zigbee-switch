name: One-shot socket expose hardening

on:
  push:
    branches:
      - assistant/socket-category-exposes-20260916

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: assistant/socket-category-exposes-20260916
          fetch-depth: 0

      - name: Install generator dependencies
        run: python3 -m pip install --disable-pip-version-check pyyaml jinja2 pytest

      - name: Apply category-aware expose policy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          gen = Path('helper_scripts/make_z2m_custom_converters.py')
          text = gen.read_text()
          old = '                "switch_level_move_rate": device.get("switch_level_move_rate", True),\n'
          new = old + '                "expose_switch_controls": device.get("category") not in {"outlet", "plug", "din_relay"},\n'
          if old not in text:
              raise SystemExit('generator insertion point not found')
          if '"expose_switch_controls"' not in text:
              text = text.replace(old, new, 1)
          gen.write_text(text)

          tpl = Path('helper_scripts/templates/switch_custom.js.jinja')
          text = tpl.read_text()

          expose_start = '            {% for switchName in device.switchNames %}\n            romasku.pressAction'
          expose_start_new = '            {% if device.expose_switch_controls %}\n            {% for switchName in device.switchNames %}\n            romasku.pressAction'
          if expose_start not in text and expose_start_new not in text:
              raise SystemExit('switch expose loop start not found')
          text = text.replace(expose_start, expose_start_new)

          expose_end = '''            {% if device.switch_level_move_rate %}\n            romasku.levelMoveRate("{{switchName}}_level_move_rate", "{{switchName}}"),\n            {% endif %}\n            {% endfor %}\n            {% for relayName in device.relayIndicatorNames %}'''
          expose_end_new = '''            {% if device.switch_level_move_rate %}\n            romasku.levelMoveRate("{{switchName}}_level_move_rate", "{{switchName}}"),\n            {% endif %}\n            {% endfor %}\n            {% endif %}\n            {% for relayName in device.relayIndicatorNames %}'''
          if expose_end not in text and expose_end_new not in text:
              raise SystemExit('switch expose loop end not found')
          text = text.replace(expose_end, expose_end_new)

          cfg_start = '            {% for switchName in device.switchNames %}\n            const endpoint{{loop.index}} = device.getEndpoint({{loop.index}});'
          cfg_start_new = '            {% if device.expose_switch_controls %}\n            {% for switchName in device.switchNames %}\n            const endpoint{{loop.index}} = device.getEndpoint({{loop.index}});'
          if cfg_start not in text and cfg_start_new not in text:
              raise SystemExit('switch configure loop start not found')
          text = text.replace(cfg_start, cfg_start_new)

          cfg_end = '            {% endfor %}\n            {% if device.has_battery_cluster %}'
          cfg_end_new = '            {% endfor %}\n            {% endif %}\n            {% if device.has_battery_cluster %}'
          if cfg_end not in text and cfg_end_new not in text:
              raise SystemExit('switch configure loop end not found')
          text = text.replace(cfg_end, cfg_end_new)
          tpl.write_text(text)

          test = Path('tests/test_bseed_socket_converter_exposes.py')
          test.write_text('''import subprocess\nimport sys\nfrom pathlib import Path\n\nROOT = Path(__file__).resolve().parents[1]\nGEN = ROOT / "helper_scripts" / "make_z2m_custom_converters.py"\n\n\ndef _render(*extra: str) -> str:\n    return subprocess.check_output(\n        [sys.executable, str(GEN), *extra, "device_db.yaml"],\n        cwd=ROOT,\n        text=True,\n    )\n\n\ndef _definition(text: str, zigbee_model: str) -> str:\n    marker = f'"{zigbee_model}"'\n    start = text.index(marker)\n    next_start = text.find("\\n    {\\n        zigbeeModel:", start + len(marker))\n    return text[start:] if next_start == -1 else text[start:next_start]\n\n\nSOCKET_ONLY_SWITCH_CONTROLS = (\n    "switch_press_action",\n    "switch_mode",\n    "switch_action_mode",\n    "switch_relay_mode",\n    "switch_relay_index",\n    "switch_binded_mode",\n    "switch_long_press_duration",\n    "switch_level_move_rate",\n)\n\n\ndef test_bseed_pm_outlet_hides_switch_and_dimmer_controls():\n    for args in [(), ("--z2m-v1",)]:\n        definition = _definition(_render(*args), "TS011F-BS-PM")\n        for expose in SOCKET_ONLY_SWITCH_CONTROLS:\n            assert expose not in definition\n        assert 'onOff({ endpointNames: ["relay"] })' in definition\n        assert 'relay_physical_mode' in definition\n        assert 'relay_indicator_mode' in definition\n\n\ndef test_non_pm_bseed_outlet_uses_same_socket_profile():\n    for args in [(), ("--z2m-v1",)]:\n        definition = _definition(_render(*args), "TS011F-BS")\n        for expose in SOCKET_ONLY_SWITCH_CONTROLS:\n            assert expose not in definition\n        assert 'onOff({ endpointNames: ["relay"] })' in definition\n\n\ndef test_non_outlet_switch_keeps_full_switch_controls():\n    for args in [(), ("--z2m-v1",)]:\n        definition = _definition(_render(*args), "TS0004-MC")\n        assert "switch_mode" in definition\n        assert "switch_action_mode" in definition\n        assert "switch_relay_mode" in definition\n        assert "switch_long_press_duration" in definition\n        assert "switch_level_move_rate" in definition\n''')
          PY

      - name: Regenerate both Zigbee2MQTT converter variants
        shell: bash
        run: |
          set -euo pipefail
          python3 helper_scripts/make_z2m_custom_converters.py device_db.yaml > zigbee2mqtt/converters/switch_custom.js
          python3 helper_scripts/make_z2m_custom_converters.py --z2m-v1 device_db.yaml > zigbee2mqtt/converters_v1/switch_custom.js
          node --check zigbee2mqtt/converters/switch_custom.js
          node --check zigbee2mqtt/converters_v1/switch_custom.js

      - name: Validate category contract
        run: python3 -m pytest -q tests/test_bseed_socket_converter_exposes.py

      - name: Commit intended changes only
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/socket-category-expose-hardening.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add helper_scripts/make_z2m_custom_converters.py helper_scripts/templates/switch_custom.js.jinja tests/test_bseed_socket_converter_exposes.py zigbee2mqtt/converters/switch_custom.js zigbee2mqtt/converters_v1/switch_custom.js
          git commit -m 'Make socket exposes category-aware'
          git push origin HEAD:assistant/socket-category-exposes-20260916
