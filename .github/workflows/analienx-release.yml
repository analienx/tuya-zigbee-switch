name: Analienx AVATTO and BSEED TS0726 release

on:
  pull_request:
    paths:
      - 'src/**'
      - 'device_db.yaml'
      - 'VERSION'
      - 'NVM_MIGRATIONS_VERSION'
      - 'helper_scripts/analienx_release.py'
      - 'helper_scripts/bseed_pm_boot.py'
      - 'helper_scripts/bseed_pm_ota_activation.py'
      - 'make_scripts/build_analienx_board.sh'
      - 'zigbee2mqtt/ota/index_router.json'
      - 'zigbee2mqtt/ota/index_end_device.json'
      - '.github/workflows/analienx-release.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'device_db.yaml'
      - 'helper_scripts/analienx_release.py'
      - 'make_scripts/build_analienx_board.sh'
      - '.github/workflows/analienx-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-set:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install YAML parser
        run: sudo apt-get update && sudo apt-get install -y python3-yaml
      - name: Validate the release set and emit the build matrix
        id: matrix
        run: |
          set -euo pipefail
          python3 helper_scripts/analienx_release.py list
          echo "matrix=$(python3 helper_scripts/analienx_release.py matrix)" >> "$GITHUB_OUTPUT"

  board:
    needs: release-set
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release-set.outputs.matrix) }}
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      BOARD: ${{ matrix.board }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Prove exact candidate head
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make python3 python3-yaml curl wget unzip bzip2
      - uses: actions/cache@v4
        with:
          path: telink_tools
          key: telink-tools-v3.7.2.0
      - name: Install pinned compiler, SDK and TC32 model
        env:
          TC32_EMULATOR_REV: 2e1bcaed762e3124b024047db981172d2b0395ba
        run: |
          set -euo pipefail
          make -C src/telink -f tools.mk sdk toolchain
          git clone --quiet https://github.com/goyamamoto/tc32-devtools.git "$RUNNER_TEMP/tc32"
          git -C "$RUNNER_TEMP/tc32" checkout --quiet --detach "$TC32_EMULATOR_REV"
          echo "PYTHONPATH=$RUNNER_TEMP/tc32/emulator" >> "$GITHUB_ENV"
          echo "TC32EMU_FLASH_SIZE=0x80000" >> "$GITHUB_ENV"
      - name: Build the board and capture its linker symbols
        run: |
          set -euo pipefail
          bash make_scripts/build_analienx_board.sh "$BOARD" "build/analienx/$BOARD"
          telink_tools/toolchain/tc32/bin/tc32-elf-objdump -t build/telink/tlc_switch.elf \
            > "build/analienx/$BOARD/tc32-symbols.txt"
      - name: Verify identity, boot the OTA payload and run its own OTA activation
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'helper_scripts')
          import analienx_release as release
          from bseed_pm_boot import verify_boot
          from bseed_pm_ota_activation import verify_activation

          board = os.environ['BOARD']
          folder = Path('build/analienx') / board
          ota = folder / 'forward.ota'
          data = ota.read_bytes()
          manifest = json.loads((folder / 'manifest.json').read_text())
          expected = release.candidate(release.load_db(), board)
          digest = hashlib.sha256(data).hexdigest()
          checks = {
              'exact source': manifest['sourceCommit'] == os.environ['EXPECTED_HEAD'],
              'clean source': manifest['sourceDirty'] is False,
              'board': manifest['board'] == board,
              'identity': (manifest['swBuildId'], manifest['fileVersion'], manifest['otaHeader']['imageType'])
                          == (expected['build'], expected['version'], expected['type']),
              'payload hash': manifest['artifacts']['forward.ota']['sha256'] == digest,
          }
          failed = [name for name, passed in checks.items() if not passed]
          if failed:
              sys.exit(f'{board}: release identity refused: {", ".join(failed)}')
          integrity = release.verify_native_image(data, expected)
          symbols = folder / 'tc32-symbols.txt'
          boot = verify_boot(ota, symbols, digest)
          # The next OTA is the only way off this image: its own activation
          # routine must accept, reject and survive power loss in both slots.
          activation = verify_activation(ota, symbols, digest, ota, digest)
          report = dict(sourceCommit=os.environ['EXPECTED_HEAD'], board=board, live=expected['live'],
                        build=expected['build'], version=expected['version'], imageType=expected['type'],
                        otaSha256=digest, tc32Boot=boot, tc32Activation=activation, **integrity)
          (folder / 'BOOT_REPORT.json').write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps(report, indent=2))
          PY
      - name: Upload board evidence; do not publish or flash
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analienx-${{ matrix.board }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            build/analienx/${{ matrix.board }}/forward.ota
            build/analienx/${{ matrix.board }}/forward.bin
            build/analienx/${{ matrix.board }}/manifest.json
            build/analienx/${{ matrix.board }}/BOOT_REPORT.json
            build/analienx/${{ matrix.board }}/tc32-symbols.txt
          if-no-files-found: warn

  summary:
    needs: [release-set, board]
    if: always() && needs.release-set.result == 'success'
    runs-on: ubuntu-latest
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install YAML parser
        run: sudo apt-get update && sudo apt-get install -y python3-yaml
      - uses: actions/download-artifact@v4
        with:
          pattern: analienx-*-${{ github.event.pull_request.head.sha || github.sha }}
          path: release
      - name: Require complete, distinct evidence for every board
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'helper_scripts')
          import analienx_release as release
          head = os.environ['EXPECTED_HEAD']
          boards = release.validate(release.load_db())
          rows, problems, hashes = [], [], {}
          for board in boards:
              folder = Path('release') / f'analienx-{board}-{head}'
              report_path = folder / 'BOOT_REPORT.json'
              if not report_path.exists():
                  problems.append(f'{board}: no boot report')
                  continue
              report = json.loads(report_path.read_text())
              if report.get('sourceCommit') != head or report.get('board') != board:
                  problems.append(f'{board}: report for another source or board')
              if not report.get('tc32Boot') or not report.get('tc32Activation'):
                  problems.append(f'{board}: missing TC32 start or activation evidence')
              if report['otaSha256'] in hashes:
                  problems.append(f'{board}: same bytes as {hashes[report["otaSha256"]]}')
              hashes[report['otaSha256']] = board
              rows.append({key: report[key] for key in ('board', 'live', 'build', 'version', 'imageType', 'otaSha256')})
          Path('RELEASE_SET.json').write_text(json.dumps({'sourceCommit': head, 'release': release.RELEASE,
                                                          'boards': rows}, indent=2) + '\n')
          for row in rows:
              print(f"{'LIVE ' if row['live'] else '     '}{row['board']:32} {row['imageType']} {row['otaSha256'][:16]}")
          if problems:
              sys.exit('\n'.join(problems))
          print(f'{len(rows)} boards built, started and self-activated in the TC32 model')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: analienx-release-set-${{ github.event.pull_request.head.sha || github.sha }}
          path: RELEASE_SET.json
