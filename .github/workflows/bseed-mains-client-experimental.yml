name: BSEED experimental mains clients

on:
  workflow_dispatch:
  push:
    branches:
      - supervisor/bseed-mains-client-experimental
  pull_request:

jobs:
  build-clients:
    runs-on: ubuntu-latest
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Prove exact candidate head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make python3 python3-pytest python3-yaml curl wget unzip bzip2

      - name: Cache Telink SDK and toolchain
        uses: actions/cache@v4
        with:
          path: telink_tools
          key: telink-tools-v3.7.2.0

      - name: Install pinned Telink build dependencies
        run: make -C src/telink -f tools.mk sdk toolchain

      - name: Record exact build environment
        shell: bash
        run: |
          set -euo pipefail
          TC32=./telink_tools/toolchain/tc32/bin/tc32-elf-gcc
          {
            echo "head=$(git rev-parse HEAD)"
            echo "status_begin"
            git status --porcelain
            echo "status_end"
            echo "python=$(python3 --version 2>&1)"
            echo "make=$(make --version | head -1)"
            "$TC32" --version | head -1
            sha256sum telink_tools/downloads/tc32_gcc_v2.0.tar.bz2
          } > "$RUNNER_TEMP/client-build-environment.txt"

      - name: Verify stored historical artifacts against sealed identities
        shell: bash
        run: |
          set -o pipefail
          # Historical bytes are verified directly from pinned stored
          # artifacts. They are never rebuilt from current shared source.
          make bseed/identity-gate 2>&1 | tee "$RUNNER_TEMP/historical-identity-gate.log"

      - name: Build separate PM and TS0726 mains clients
        shell: bash
        run: |
          set -euo pipefail
          bash make_scripts/build_bseed_mains_client.sh pm
          bash make_scripts/build_bseed_mains_client.sh ts0726
          cp build/bseed-ts011f-pm-client/forward.bin "$RUNNER_TEMP/pm-client-first.bin"
          cp build/bseed-ts011f-pm-client/forward.ota "$RUNNER_TEMP/pm-client-first.ota"
          cp build/bseed-ts011f-pm-client/from-router.ota "$RUNNER_TEMP/pm-client-first-from-router.ota"
          cp build/bseed-ts0726-client/forward.bin "$RUNNER_TEMP/ts0726-client-first.bin"
          cp build/bseed-ts0726-client/forward.ota "$RUNNER_TEMP/ts0726-client-first.ota"
          cp build/bseed-ts0726-client/from-router.ota "$RUNNER_TEMP/ts0726-client-first-from-router.ota"

      - name: Prove exact-source candidate identities
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          def require(condition, message):
              if not condition:
                  raise SystemExit('candidate identity rejected: ' + message)

          cases = [
              (Path('build/bseed-ts011f-pm-client/manifest.json'), 'pm',
               'OUTLET_BSEED_PM_TS011F', '1.2.5-bseedcli12', 0x12053016, 65024),
              (Path('build/bseed-ts0726-client/manifest.json'), 'ts0726',
               'SWITCH_BSEED_TS0726_3GANG', '1.1.8-bseedcli3', 0x1102300F, 65025),
          ]
          for path, target, board, build, version, image_type in cases:
              manifest = json.loads(path.read_text())
              require(manifest['sourceCommit'] == os.environ['EXPECTED_HEAD'],
                      '%s sourceCommit is not the candidate head' % target)
              require(manifest['sourceDirty'] is False, '%s built from dirty source' % target)
              require(manifest['target'] == target, '%s target mismatch' % target)
              require(manifest['board'] == board, '%s board mismatch' % target)
              require(manifest['swBuildId'] == build, '%s build ID mismatch' % target)
              require(manifest['fileVersion'] == version, '%s file version mismatch' % target)
              require(manifest['manufacturerCode'] == 4417, '%s manufacturer mismatch' % target)
              require(manifest['clientImageType'] == image_type, '%s image type mismatch' % target)
          print('exact-source candidate identities: PASS')
          PY

      - name: Build sealed client-to-router rollback wrappers from pinned history
        shell: bash
        run: |
          set -euo pipefail
          # Rollback wraps sealed historical Router bytes, never a fresh
          # rebuild. reseal-ota refuses a wrong pinned source tuple.
          python3 src/telink/make_ota.py reseal-ota \
            --manufacturer-id 4417 \
            --source-image-type 43556 --source-file-version 0x12053007 \
            --image-type 65024 --file-version 0xFFFFFFFF \
            zigbee2mqtt/ota/bseed/ts011f-pm-v12053007.ota \
            build/bseed-ts011f-pm-client/rollback-to-router.ota
          python3 src/telink/make_ota.py reseal-ota \
            --manufacturer-id 4417 \
            --source-image-type 45577 --source-file-version 0x1102300A \
            --image-type 65025 --file-version 0xFFFFFFFF \
            zigbee2mqtt/ota/bseed/ts0726-v1102300a.ota \
            build/bseed-ts0726-client/rollback-to-router.ota
          python3 - <<'PY'
          import pathlib
          import struct

          def require(condition, message):
              if not condition:
                  raise SystemExit('rollback wrapper rejected: ' + message)

          cases = [
              (pathlib.Path('zigbee2mqtt/ota/bseed/ts011f-pm-v12053007.ota'),
               pathlib.Path('build/bseed-ts011f-pm-client/rollback-to-router.ota'), 65024),
              (pathlib.Path('zigbee2mqtt/ota/bseed/ts0726-v1102300a.ota'),
               pathlib.Path('build/bseed-ts0726-client/rollback-to-router.ota'), 65025),
          ]
          for source_path, path, image_type in cases:
              source = source_path.read_bytes()
              rollback = path.read_bytes()
              values = struct.unpack('<I5HIH32sI', rollback[:56])
              require(values[0] == 0x0BEEF11E, '%s bad OTA magic' % path)
              require(values[4] == 4417, '%s manufacturer mismatch' % path)
              require(values[5] == image_type, '%s image type mismatch' % path)
              require(values[6] == 0xFFFFFFFF, '%s must be max-version' % path)
              require(values[-1] == path.stat().st_size, '%s size mismatch' % path)
              require(rollback[56:] == source[56:], '%s payload differs from pinned history' % path)
              diffs = [i for i, (a, b) in enumerate(zip(source, rollback)) if a != b]
              require(diffs == [12, 13, 14, 15, 16, 17], '%s unexpected header diffs %r' % (path, diffs))
          print('sealed rollback wrappers: PASS')
          PY

      - name: Rebuild both clients and require byte-identical output
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/bseed-ts011f-pm-client build/bseed-ts0726-client
          bash make_scripts/build_bseed_mains_client.sh pm
          bash make_scripts/build_bseed_mains_client.sh ts0726
          cmp "$RUNNER_TEMP/pm-client-first.bin" build/bseed-ts011f-pm-client/forward.bin
          cmp "$RUNNER_TEMP/pm-client-first.ota" build/bseed-ts011f-pm-client/forward.ota
          cmp "$RUNNER_TEMP/pm-client-first-from-router.ota" build/bseed-ts011f-pm-client/from-router.ota
          cmp "$RUNNER_TEMP/ts0726-client-first.bin" build/bseed-ts0726-client/forward.bin
          cmp "$RUNNER_TEMP/ts0726-client-first.ota" build/bseed-ts0726-client/forward.ota
          cmp "$RUNNER_TEMP/ts0726-client-first-from-router.ota" build/bseed-ts0726-client/from-router.ota

      - name: Rebuild rollback wrappers after reproducibility rebuild
        shell: bash
        run: |
          set -euo pipefail
          python3 src/telink/make_ota.py reseal-ota \
            --manufacturer-id 4417 \
            --source-image-type 43556 --source-file-version 0x12053007 \
            --image-type 65024 --file-version 0xFFFFFFFF \
            zigbee2mqtt/ota/bseed/ts011f-pm-v12053007.ota \
            build/bseed-ts011f-pm-client/rollback-to-router.ota
          python3 src/telink/make_ota.py reseal-ota \
            --manufacturer-id 4417 \
            --source-image-type 45577 --source-file-version 0x1102300A \
            --image-type 65025 --file-version 0xFFFFFFFF \
            zigbee2mqtt/ota/bseed/ts0726-v1102300a.ota \
            build/bseed-ts0726-client/rollback-to-router.ota
          sha256sum \
            build/bseed-ts011f-pm-client/forward.bin \
            build/bseed-ts011f-pm-client/forward.ota \
            build/bseed-ts011f-pm-client/from-router.ota \
            build/bseed-ts011f-pm-client/rollback-to-router.ota \
            build/bseed-ts0726-client/forward.bin \
            build/bseed-ts0726-client/forward.ota \
            build/bseed-ts0726-client/from-router.ota \
            build/bseed-ts0726-client/rollback-to-router.ota \
            > "$RUNNER_TEMP/client-sha256.txt"

      - name: Prove client role and binding contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pytest -q tests/test_bseed_mains_client.py
          python3 - <<'PY'
          import json
          import pathlib

          def require(condition, message):
              if not condition:
                  raise SystemExit('client contract rejected: ' + message)

          for path, expected_pm in [
              (pathlib.Path('build/bseed-ts011f-pm-client/manifest.json'), True),
              (pathlib.Path('build/bseed-ts0726-client/manifest.json'), False),
          ]:
              m = json.loads(path.read_text())
              require(m['experimental'] is True, '%s not experimental' % path)
              require(m['role']['logicalType'] == 'end-device', '%s role' % path)
              require(m['role']['routing'] is False, '%s routing' % path)
              require(m['role']['sleepy'] is False, '%s sleepy' % path)
              require(m['role']['rxOnWhenIdle'] is True, '%s rx-on' % path)
              require(m['role']['powerSource'] == 'mains', '%s power' % path)
              require(m['role']['pmEnabled'] is expected_pm, '%s pmEnabled' % path)
              require(m['binding']['roleSpecificBindingFork'] is False, '%s binding fork' % path)
              require(m['distribution']['normalOtaIndex'] is False, '%s index' % path)
              require(m['distribution']['stockConversion'] is False, '%s stock conversion' % path)
          print('client role and binding contracts: PASS')
          PY

      - name: Upload immutable experimental client artifacts and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bseed-mains-clients-experimental-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/client-build-environment.txt
            ${{ runner.temp }}/historical-identity-gate.log
            ${{ runner.temp }}/client-sha256.txt
            build/bseed-ts011f-pm-client/forward.bin
            build/bseed-ts011f-pm-client/forward.ota
            build/bseed-ts011f-pm-client/from-router.ota
            build/bseed-ts011f-pm-client/rollback-to-router.ota
            build/bseed-ts011f-pm-client/manifest.json
            build/bseed-ts0726-client/forward.bin
            build/bseed-ts0726-client/forward.ota
            build/bseed-ts0726-client/from-router.ota
            build/bseed-ts0726-client/rollback-to-router.ota
            build/bseed-ts0726-client/manifest.json
          if-no-files-found: warn
