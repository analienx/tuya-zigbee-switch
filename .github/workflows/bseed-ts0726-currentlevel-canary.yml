name: BSEED TS0726 CurrentLevel canary artifact

on:
  pull_request:
    paths:
      - 'make_scripts/build_bseed_ts0726_v8.sh'
      - 'make_scripts/build_bseed_ts0726_level_canary.sh'
      - 'tests/test_bseed_ts0726_currentlevel_canary.py'
      - '.github/workflows/bseed-ts0726-currentlevel-canary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-currentlevel-canary:
    runs-on: ubuntu-latest
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install pinned Telink build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make python3 python3-pytest python3-yaml curl wget unzip bzip2

      - name: Cache Telink SDK and TC32 toolchain
        uses: actions/cache@v4
        with:
          path: telink_tools
          key: telink-tools-v3.7.2.0

      - name: Prepare toolchain and test opt-in identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          make -C src/telink -f tools.mk sdk toolchain
          python3 -m pytest -q tests/test_bseed_ts0726_currentlevel_canary.py

      - name: Build candidate only, never publish or flash
        shell: bash
        run: |
          set -euo pipefail
          bash make_scripts/build_bseed_ts0726_level_canary.sh \
            build/bseed-ts0726-currentlevel-canary
          sha256sum build/bseed-ts0726-currentlevel-canary/forward.bin \
            build/bseed-ts0726-currentlevel-canary/forward.ota \
            build/bseed-ts0726-currentlevel-canary/from_tuya.ota

      - name: Verify exact identity and clean-source evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          out = Path('build/bseed-ts0726-currentlevel-canary')
          manifest = json.loads((out / 'manifest.json').read_text())
          assert manifest['sourceCommit'] == os.environ['EXPECTED_HEAD']
          assert manifest['sourceDirty'] is False
          assert manifest['board'] == 'SWITCH_BSEED_TS0726_3GANG'
          assert manifest['swBuildId'] == '1.1.9-bseedlevel1'
          assert manifest['fileVersion'] == 0x1102300D
          assert manifest['otaHeader']['manufacturerCode'] == 4417
          assert manifest['otaHeader']['imageType'] == 45577
          assert manifest['otaHeader']['fileVersion'] == 0x1102300D
          assert manifest['stockConversion']['payloadFromByte56Identical'] is True
          assert (out / 'forward.ota').stat().st_size > 56
          print('Validated source SHA, image identity and wrapper integrity')
          PY
          git diff --exit-code -- zigbee2mqtt/ota/index_bseed.json

      - name: Upload isolated canary, not a public OTA index
        uses: actions/upload-artifact@v4
        with:
          name: bseed-ts0726-currentlevel-canary
          path: |
            build/bseed-ts0726-currentlevel-canary/forward.bin
            build/bseed-ts0726-currentlevel-canary/forward.ota
            build/bseed-ts0726-currentlevel-canary/manifest.json
          if-no-files-found: error
