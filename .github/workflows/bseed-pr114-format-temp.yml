name: BSEED PR114 temporary hosted formatting round 7

on:
  push:
    branches:
      - feat/bseed-recovery-firmware-20261105

permissions:
  contents: write

jobs:
  format:
    if: "!startsWith(github.event.head_commit.message, 'chore(recovery-format):')"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
          persist-credentials: true
      - name: Install canonical repo formatter
        run: sudo apt-get update && sudo apt-get install -y uncrustify
      - name: Format changed C files, push only this draft PR branch
        shell: bash
        run: |
          set -euo pipefail
          files=(
            src/hal/router_recovery_policy.h
            src/telink/hal/recovery_diagnostics.h
            src/telink/hal/recovery_diagnostics.c
            src/telink/hal/zigbee_network.c
          )
          uncrustify -c uncrustify.cfg --replace --no-backup "${files[@]}"
          git diff --check
          if ! git diff --quiet -- "${files[@]}"; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- "${files[@]}"
            git commit -m "chore(recovery-format): canonicalize Round 7 source"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
