name: BSEED PR114 temporary hosted formatting

on:
  push:
    branches:
      - feat/bseed-recovery-firmware-20261105

permissions:
  contents: write

jobs:
  format:
    if: "!startsWith(github.event.head_commit.message, 'chore(recovery-format):')"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
          persist-credentials: true
      - name: Install repo formatter
        run: sudo apt-get update && sudo apt-get install -y uncrustify
      - name: Apply canonical format and push to this branch only
        shell: bash
        run: |
          set -euo pipefail
          files=(
            src/hal/bseed_recovery_core.h
            src/device_config/nvm_items.h
            src/telink/hal/recovery_wedge_credit.c
            src/telink/hal/recovery_wedge_credit.h
            src/telink/hal/recovery_diagnostics.c
            src/telink/hal/recovery_diagnostics.h
            src/telink/hal/router_recovery_budget.c
            src/telink/hal/router_recovery_budget.h
            src/telink/hal/telink_zigbee_hal.h
            src/telink/hal/zigbee_network.c
            src/telink/main.c
          )
          uncrustify -c uncrustify.cfg --replace --no-backup "${files[@]}"
          if ! git diff --quiet -- "${files[@]}"; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- "${files[@]}"
            git commit -m "chore(recovery-format): apply hosted uncrustify to PR114"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
