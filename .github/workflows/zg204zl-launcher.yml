name: ZG-204ZL bench launcher
on:
  workflow_dispatch:
  push:
    paths:
      - 'helper_scripts/flash_zg204zl.py'
      - 'tests/test_zg204zl_launcher.py'
      - '.github/workflows/zg204zl-launcher.yml'
permissions:
  contents: read
jobs:
  bench-model:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest pyserial
      - run: python -m pytest --noconftest tests/test_zg204zl_launcher.py -v
      - name: Check original upstream firmware pin without hardware
        shell: python
        run: |
          import sys
          sys.path.insert(0, 'helper_scripts')
          import flash_zg204zl as f
          data = f.swire.download(f.IMAGE_URL, f.IMAGE_BYTES)
          if len(data) != f.IMAGE_BYTES or f.digest(data) != f.IMAGE_SHA:
              raise SystemExit('ZG-204ZL upstream image differs from the pin')
          print('Original pinned sensor firmware matches; no hardware accessed')
