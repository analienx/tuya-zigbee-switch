name: Documentation integrity

on:
  push:
    paths:
      - README.md
      - docs/**
      - helper_scripts/bseed_pm_release.py
      - helper_scripts/bseed_nonpm_release.py
      - helper_scripts/check_docs_quality.py
      - zigbee2mqtt/ota/index_bseed.json
      - tests/test_docs_quality.py
      - .github/workflows/docs-quality.yml
  pull_request:
    paths:
      - README.md
      - docs/**
      - helper_scripts/bseed_pm_release.py
      - helper_scripts/bseed_nonpm_release.py
      - helper_scripts/check_docs_quality.py
      - zigbee2mqtt/ota/index_bseed.json
      - tests/test_docs_quality.py
      - .github/workflows/docs-quality.yml

permissions:
  contents: read

jobs:
  docs-quality:
    name: Documentation and release-state consistency
    runs-on: ubuntu-latest
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Verify checked-out SHA
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Check published versus candidate identities and Markdown navigation
        run: python3 helper_scripts/check_docs_quality.py

      - name: Exercise documentation regression tests
        run: python3 -m unittest discover -s tests -p 'test_docs_quality.py' -v
