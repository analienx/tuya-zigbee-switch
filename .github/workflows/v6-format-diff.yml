name: V6 format diff

on:
  push:
    branches:
      - supervisor/ts0726-redesign-v6-clean-binding-mode

jobs:
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - run: sudo apt-get update && sudo apt-get install -y uncrustify
      - name: Show exact formatter diff
        run: |
          uncrustify -c uncrustify.cfg --replace --no-backup src/zigbee/switch_cluster.c src/zigbee/consts.h
          git diff -- src/zigbee/switch_cluster.c src/zigbee/consts.h
