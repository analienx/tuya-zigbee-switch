name: Telink Router TC32 validation

on:
  pull_request:
    paths:
      - 'src/telink/**'
      - 'src/app.c'
      - 'src/hal/**'
      - 'src/zigbee/**'
      - 'src/base_components/**'
      - 'src/device_config/**'
      - 'make_scripts/build_bseed_ts011f_pm_v8.sh'
      - 'make_scripts/build_bseed_ts011f_nonpm_router.sh'
      - 'device_db.yaml'
      - 'NVM_MIGRATIONS_VERSION'
      - '.github/workflows/telink-router-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'src/telink/**'
      - 'src/app.c'
      - 'src/hal/**'
      - 'src/zigbee/**'
      - 'src/base_components/**'
      - 'src/device_config/**'
      - 'make_scripts/build_bseed_ts011f_pm_v8.sh'
      - 'make_scripts/build_bseed_ts011f_nonpm_router.sh'
      - 'device_db.yaml'
      - 'NVM_MIGRATIONS_VERSION'
      - '.github/workflows/telink-router-ci.yml'
  workflow_dispatch:

jobs:
  bseed-ts011f-router:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: pm
            script: make_scripts/build_bseed_ts011f_pm_v8.sh
            board: OUTLET_BSEED_PM_TS011F
            image_type: 43556
            stock_image_type: 54179
          - id: nonpm
            script: make_scripts/build_bseed_ts011f_nonpm_router.sh
            board: OUTLET_BSEED_TS011F
            image_type: 43555
            stock_image_type: 54179
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make python3 python3-yaml curl wget unzip bzip2

      - name: Cache Telink SDK and TC32 toolchain
        uses: actions/cache@v4
        with:
          path: telink_tools
          key: telink-tools-v3.7.2.0

      - name: Install pinned Telink build dependencies
        run: make -C src/telink -f tools.mk sdk toolchain

      - name: Build exact BSEED TS011F Router candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          rm -rf "build/telink-router-ci-${{ matrix.id }}"
          bash "${{ matrix.script }}" "build/telink-router-ci-${{ matrix.id }}" \
            2>&1 | tee "$RUNNER_TEMP/telink-router-${{ matrix.id }}-build.log"

      - name: Record immutable build evidence
        shell: bash
        env:
          EXPECTED_BOARD: ${{ matrix.board }}
          EXPECTED_IMAGE_TYPE: ${{ matrix.image_type }}
          EXPECTED_STOCK_IMAGE_TYPE: ${{ matrix.stock_image_type }}
          TARGET_ID: ${{ matrix.id }}
        run: |
          set -euo pipefail
          OUT="build/telink-router-ci-$TARGET_ID"
          {
            echo "expected_head=$EXPECTED_HEAD"
            echo "head=$(git rev-parse HEAD)"
            echo "target=$TARGET_ID"
            echo "status_begin"
            git status --porcelain
            echo "status_end"
            ./telink_tools/toolchain/tc32/bin/tc32-elf-gcc --version | head -1
            sha256sum "$OUT/forward.bin" "$OUT/forward.ota" "$OUT/from_tuya.ota"
          } | tee "$RUNNER_TEMP/telink-router-$TARGET_ID-evidence.txt"

          python3 - "$OUT/manifest.json" <<'PY'
          import json, os, sys
          from pathlib import Path
          manifest = json.loads(Path(sys.argv[1]).read_text())
          assert manifest['sourceCommit'] == os.environ['EXPECTED_HEAD']
          assert manifest['sourceDirty'] is False
          assert manifest['board'] == os.environ['EXPECTED_BOARD']
          assert manifest['manufacturerCode'] == 4417
          assert manifest['imageType'] == int(os.environ['EXPECTED_IMAGE_TYPE'])
          assert manifest['stockConversion']['stockImageType'] == int(os.environ['EXPECTED_STOCK_IMAGE_TYPE'])
          assert manifest['stockConversion']['payloadFromByte56Identical'] is True
          print('exact-head manifest/identity guards: PASS')
          PY

      - name: Upload TC32 Router evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telink-bseed-${{ matrix.id }}-router-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/telink-router-${{ matrix.id }}-build.log
            ${{ runner.temp }}/telink-router-${{ matrix.id }}-evidence.txt
            build/telink-router-ci-${{ matrix.id }}/forward.bin
            build/telink-router-ci-${{ matrix.id }}/forward.ota
            build/telink-router-ci-${{ matrix.id }}/from_tuya.ota
            build/telink-router-ci-${{ matrix.id }}/manifest.json
          if-no-files-found: warn
