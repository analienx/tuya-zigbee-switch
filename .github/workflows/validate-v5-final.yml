name: Validate frozen v5 overlay against ZHC 26.90.0

on:
  push:
    branches:
      - supervisor/validate-v5-final

permissions:
  contents: read

jobs:
  exact-zhc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: eaba4ceca83df265ddedde5a6ea60e72ff3522d3
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install exact ZHC
        run: |
          mkdir -p /tmp/bseed-zhc-check
          cd /tmp/bseed-zhc-check
          npm init -y
          npm install --no-audit --no-fund zigbee-herdsman-converters@26.90.0
      - name: Validate processed exposes and zero Zigbee configure mutations
        run: |
          cd /tmp/bseed-zhc-check
          node "$GITHUB_WORKSPACE/helper_scripts/probe_bseed_ts0726_v5_installed_zhc.js"             "$GITHUB_WORKSPACE/zigbee2mqtt/converters/bseed_ts0726_v5.js"
      - name: Validate protected editor transport behavior
        run: |
          node helper_scripts/probe_bseed_ts0726_v5_config_transport.js             zigbee2mqtt/converters/bseed_ts0726_v5.js
      - name: Validate action API and matcher coexistence
        run: |
          node helper_scripts/probe_bseed_ts0726_action_contract.js             zigbee2mqtt/converters/bseed_ts0726_v5.js
          node helper_scripts/probe_bseed_ts0726_v5_overlay_match.js             zigbee2mqtt/converters/bseed_ts0726_v4.js             zigbee2mqtt/converters/bseed_ts0726_v5.js
