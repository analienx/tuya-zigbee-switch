name: BSEED PM role matrix

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'helper_scripts/**'
      - 'make_scripts/**'
      - 'tests/**'
      - 'Makefile'
      - 'board.mk'
      - 'VERSION'
      - 'NVM_MIGRATIONS_VERSION'
      - 'zigbee2mqtt/ota/bseed_identity.json'
      - '.github/workflows/bseed-pm-matrix.yml'
  pull_request:

jobs:
  pm-matrix:
    runs-on: ubuntu-latest
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Prove exact candidate head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make python3 python3-pytest python3-yaml python3-paho-mqtt python3-paramiko curl wget unzip bzip2

      - name: Cache Telink SDK and toolchain
        uses: actions/cache@v4
        with:
          path: telink_tools
          key: telink-tools-v3.7.2.0

      - name: Install pinned Telink build dependencies
        run: make -C src/telink -f tools.mk sdk toolchain

      - name: Install pinned TC32 startup model
        shell: bash
        env:
          TC32_EMULATOR_REV: 2e1bcaed762e3124b024047db981172d2b0395ba
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/goyamamoto/tc32-devtools.git "$RUNNER_TEMP/tc32"
          git -C "$RUNNER_TEMP/tc32" checkout --quiet --detach "$TC32_EMULATOR_REV"
          echo "PYTHONPATH=$RUNNER_TEMP/tc32/emulator" >> "$GITHUB_ENV"
          echo "TC32EMU_FLASH_SIZE=0x80000" >> "$GITHUB_ENV"

      - name: Replay the shipped r19 and r21 boot and OTA activation cases
        shell: bash
        run: |
          set -euo pipefail
          replay() {
            local label="$1" source="$2" ota_hash="$3"
            shift 3
            local control="$RUNNER_TEMP/boot-control-$label"
            git worktree add --quiet --detach "$control" "$source"
            ln -s "$GITHUB_WORKSPACE/telink_tools" "$control/telink_tools"
            (
              cd "$control" &&
              BSEED_PM_CONSOLIDATED=1 BSEED_PM_CONSOLIDATED_OUTPUT=build/boot-control \
                bash make_scripts/build_bseed_ts011f_pm_v8.sh &&
              telink_tools/toolchain/tc32/bin/tc32-elf-objdump -t build/telink/tlc_switch.elf \
                > build/boot-control/tc32-symbols.txt
            ) > "$RUNNER_TEMP/boot-control-$label.log" 2>&1 || {
              tail -80 "$RUNNER_TEMP/boot-control-$label.log"
              return 1
            }
            python3 helper_scripts/bseed_pm_boot.py "$control/build/boot-control/forward.ota" \
              "$control/build/boot-control/tc32-symbols.txt" "$ota_hash" "$@"
          }
          r19_hash=d17571a1d996ff798f1b6334cac1d799fbc1c6125a0212741aca89446053fc95
          r21_hash=9be8010d4f85e31a378a85bb159860dcccf2febd2a398b32f7f2dda4cc4f70fb
          replay r19 1cc08a92d4dd68ff3607dc224f707c3e757d4ec8 "$r19_hash"
          replay r21 b28624d80b4f3c419954239de2c919a2cf53f1a1 "$r21_hash" --expect-r21-fault
          r19="$RUNNER_TEMP/boot-control-r19/build/boot-control"
          r21="$RUNNER_TEMP/boot-control-r21/build/boot-control"
          python3 helper_scripts/bseed_pm_ota_activation.py "$r19/forward.ota" \
            "$r19/tc32-symbols.txt" "$r19_hash" "$r21/forward.ota" "$r21_hash"

      - name: Run PM Router/Client matrix from one commit
        shell: bash
        run: |
          set -o pipefail
          make bseed/pm-matrix 2>&1 | tee "$RUNNER_TEMP/pm-matrix.log"

      - name: Upload matrix evidence
        uses: actions/upload-artifact@v4
        with:
          name: bseed-pm-role-matrix-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            build/bseed-pm-role-matrix-*/ROLE_MATRIX.json
            build/bseed-pm-role-matrix-*/router/forward.ota
            build/bseed-pm-role-matrix-*/router/manifest.json
            build/bseed-pm-role-matrix-*/client/forward.ota
            build/bseed-pm-role-matrix-*/client/manifest.json
          if-no-files-found: error

      - name: Prepare wired SWire recovery kits for both roles
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          matrices=(build/bseed-pm-role-matrix-*/)
          test "${#matrices[@]}" -eq 1
          matrix="${matrices[0]%/}"
          kit=build/wired-kit
          mkdir -p "$kit"
          cp helper_scripts/telink_swire_recovery.py "$kit/"
          sed "s|(\.\./\.\./|(https://github.com/analienx/tuya-zigbee-switch/blob/$(git rev-parse HEAD)/|g;s|(swire/AGENTS.md)|(AGENTS.md)|g" docs/flashing/swire_recovery.md > "$kit/README.md"
          sed "s|(\.\./swire_recovery\.md)|(README.md)|g;s|(\.\./swire_recovery_review\.md)|(swire_recovery_review.md)|g;s|(\.\./\.\./\.\./|(https://github.com/analienx/tuya-zigbee-switch/blob/$(git rev-parse HEAD)/|g" docs/flashing/swire/AGENTS.md > "$kit/AGENTS.md"
          cp docs/flashing/swire_recovery_review.md "$kit/"
          for role in router client; do
            python3 helper_scripts/telink_swire_recovery.py prepare \
              --ota "$matrix/$role/forward.ota" --manifest "$matrix/$role/manifest.json" \
              --role-matrix "$matrix/ROLE_MATRIX.json" --out "$kit/$role"
          done

      - name: Upload wired recovery kits
        uses: actions/upload-artifact@v4
        with:
          name: bseed-pm-wired-kit-${{ github.event.pull_request.head.sha || github.sha }}
          path: build/wired-kit/
          if-no-files-found: error

      - name: Upload matrix log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bseed-pm-role-matrix-log-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/pm-matrix.log
          if-no-files-found: ignore

