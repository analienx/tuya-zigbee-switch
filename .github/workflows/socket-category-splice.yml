name: One-shot narrow socket converter diff

on:
  push:
    branches:
      - assistant/socket-category-exposes-20260916

permissions:
  contents: write

jobs:
  splice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: assistant/socket-category-exposes-20260916
          fetch-depth: 0
      - name: Install generator dependencies
        run: python3 -m pip install --disable-pip-version-check pyyaml jinja2 pytest
      - name: Replace only socket-category generated definitions
        shell: bash
        run: |
          set -euo pipefail
          git checkout origin/main -- zigbee2mqtt/converters/switch_custom.js zigbee2mqtt/converters_v1/switch_custom.js
          python3 helper_scripts/make_z2m_custom_converters.py device_db.yaml > /tmp/new-modern.js
          python3 helper_scripts/make_z2m_custom_converters.py --z2m-v1 device_db.yaml > /tmp/new-v1.js
          python3 - <<'PY'
          from pathlib import Path
          import yaml

          categories = {'outlet', 'plug', 'din_relay'}
          db = yaml.safe_load(Path('device_db.yaml').read_text())
          models = []
          for device in db.values():
              if device.get('category') not in categories or not device.get('build', True):
                  continue
              parts = device['config_str'].rstrip(';').split(';')
              if len(parts) >= 2:
                  models.append(parts[1])
              models.extend(device.get('old_zb_models') or [])
          models = sorted(set(models))

          marker = '\n    {\n        zigbeeModel:'
          def block_span(text, model):
              pos = text.find(f'"{model}"')
              if pos < 0:
                  return None
              start = text.rfind(marker, 0, pos)
              if start < 0:
                  return None
              start += 1
              nxt = text.find(marker, pos)
              end = len(text) if nxt < 0 else nxt + 1
              return start, end

          def splice(old_path, new_path):
              text = Path(old_path).read_text()
              new = Path(new_path).read_text()
              changed = set()
              for model in models:
                  old_span = block_span(text, model)
                  new_span = block_span(new, model)
                  if not old_span or not new_span:
                      continue
                  old_start, old_end = old_span
                  new_start, new_end = new_span
                  old_block = text[old_start:old_end]
                  new_block = new[new_start:new_end]
                  if old_block != new_block:
                      text = text[:old_start] + new_block + text[old_end:]
                      changed.add(model)
              Path(old_path).write_text(text)
              print(f'{old_path}: category definitions changed={len(changed)}')

          splice('zigbee2mqtt/converters/switch_custom.js', '/tmp/new-modern.js')
          splice('zigbee2mqtt/converters_v1/switch_custom.js', '/tmp/new-v1.js')
          PY
          node --check zigbee2mqtt/converters/switch_custom.js
          node --check zigbee2mqtt/converters_v1/switch_custom.js
          python3 -m pytest -q tests/test_bseed_socket_converter_exposes.py
      - name: Commit narrowed generated output
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/socket-category-splice.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add zigbee2mqtt/converters/switch_custom.js zigbee2mqtt/converters_v1/switch_custom.js
          git commit -m 'Limit generated converter update to socket categories'
          git push origin HEAD:assistant/socket-category-exposes-20260916
