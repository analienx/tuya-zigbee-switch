name: format-v5-supervisor

on:
  push:
    branches:
      - supervisor/ts0726-redesign-v5

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          ref: supervisor/ts0726-redesign-v5
      - name: Install pinned formatter
        run: |
          sudo apt-get update
          sudo apt-get install -y uncrustify=0.78.1+dfsg1-1
      - name: Format only supervisor v5 changed C surfaces
        run: |
          files=(
            src/device_config/config_nv.c
            src/stub/hal/zigbee.c
            src/stub/commands.c
            src/zigbee/relay_cluster.c
            src/zigbee/basic_cluster.c
            src/zigbee/consts.h
            src/zigbee/switch_cluster.c
          )
          uncrustify -c uncrustify.cfg --replace --no-backup "${files[@]}"
          git diff --check
      - name: Commit exact formatter output
        run: |
          git config user.name "Supervisor formatter"
          git config user.email "actions@github.com"
          git add             src/device_config/config_nv.c             src/stub/hal/zigbee.c             src/stub/commands.c             src/zigbee/relay_cluster.c             src/zigbee/basic_cluster.c             src/zigbee/consts.h             src/zigbee/switch_cluster.c
          if git diff --cached --quiet; then
            echo "No formatting changes"
          else
            git commit -m "style: format v5 supervisor changes"
            git push origin HEAD:supervisor/ts0726-redesign-v5
          fi
