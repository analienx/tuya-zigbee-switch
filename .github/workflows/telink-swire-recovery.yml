name: Telink SWire recovery tool

on:
  workflow_dispatch:
    inputs:
      r19_artifact_run:
        description: 'Optional original r19 PM matrix run to validate the historical rollback bytes'
        required: false
        default: ''
  push:
    paths:
      - 'helper_scripts/telink_swire_recovery.py'
      - 'tests/test_telink_swire_recovery.py'
      - '.github/workflows/telink-swire-recovery.yml'
      - 'zigbee2mqtt/ota/index_*.json'
      - 'device_db.yaml'
  pull_request:
    paths:
      - 'helper_scripts/telink_swire_recovery.py'
      - 'tests/test_telink_swire_recovery.py'
      - '.github/workflows/telink-swire-recovery.yml'
      - 'zigbee2mqtt/ota/index_*.json'
      - 'device_db.yaml'

permissions:
  contents: read
  actions: read

jobs:
  windows-agent-contract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest pyserial
      - run: python -m pytest --noconftest tests/test_telink_swire_recovery.py -v

  swire-tool:
    runs-on: ubuntu-latest
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      # analienx/gledopto recovery branch; its kit pins the same stock image.
      GLEDOPTO_COMMIT: 895567036301d25da68161358f96a37971488a08
      GLEDOPTO_OTA_SHA256: 16595a38ab9783d3afc4eb58ab4ec32625249bd569c1fa6dbaf468bddc76dd72
      GLEDOPTO_IMAGE_SHA256: 7ba122f1ebc9f6ec419d9ea6b27676d55c2a2aad864a03e90b896546248c4b48
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Prove exact candidate head
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python-only diagnostic dependencies
        run: python -m pip install pytest pyserial pyyaml

      - name: Run the tool against the chip and flash model
        run: python3 -m pytest --noconftest tests/test_telink_swire_recovery.py -v

      - name: Verify pinned upstream reader provenance
        run: |
          python helper_scripts/telink_swire_recovery.py fetch-reader --json > "$RUNNER_TEMP/reader-setup.json"
          python helper_scripts/telink_swire_recovery.py fetch-reader --json > "$RUNNER_TEMP/reader-cached.json"
          python - "$RUNNER_TEMP" <<'EOF'
          import json, pathlib, shutil, sys
          root = pathlib.Path(sys.argv[1])
          first = json.loads((root / 'reader-setup.json').read_text())
          cached = json.loads((root / 'reader-cached.json').read_text())
          if cached['cacheStatus'] != 'CACHED' or first['reader'] != cached['reader']:
              sys.exit('Reader setup did not reuse its verified cache')
          shutil.copyfile(first['reader'], root / 'reader.py')
          EOF
          echo "2ea1b7c5266821e5d384a263daa7916bb4020fcdfb8f1ec0bed5842dcb94ca18  $RUNNER_TEMP/reader.py" | sha256sum --check

      - name: Match diagnostic read frames and sampling against the pinned upstream implementation
        run: |
          python - "$RUNNER_TEMP/reader.py" <<'EOF'
          import importlib.util, sys
          sys.path.insert(0, 'helper_scripts')
          import telink_swire_recovery as tool
          spec = importlib.util.spec_from_file_location('pinned_pvvx', sys.argv[1])
          reference = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(reference)
          for address in (0xB2, 0x602, 0x0C):
              if tool.diagnostic_read_header(address) != bytes(reference.sws_rd_addr(address)):
                  sys.exit('Diagnostic read header differs from pvvx')
          for value in range(256):
              samples = bytes((0xFE & ~(0x20 if i == 0 else 0x10))
                              if value & (1 << (7-i)) else 0xFE for i in range(8)) + b'\xfe'
              if tool.diagnostic_decode(samples) != reference.sws_decode_blk(samples) or tool.diagnostic_decode(samples) != value:
                  sys.exit('Diagnostic response decoder differs from pvvx')
          print('Diagnostic read headers and all 256 response values match the pinned upstream implementation')
          EOF

      - name: Prepare the GL-SD-301P stock OTA and match the Gledopto kit
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/stock.ota" \
            "https://raw.githubusercontent.com/analienx/gledopto/$GLEDOPTO_COMMIT/devices/gl-sd-301p/vendor-firmware/originals/GL-SD-301P_V20851203_20251230.ota"
          python3 helper_scripts/telink_swire_recovery.py prepare --ota "$RUNNER_TEMP/stock.ota" \
            --device gledopto-gl-sd-301p --out "$RUNNER_TEMP/gledopto-kit" --expect-ota-sha256 "$GLEDOPTO_OTA_SHA256"
          python3 - "$RUNNER_TEMP/gledopto-kit/plan.json" <<'EOF'
          import json, os, sys
          image = json.load(open(sys.argv[1]))['image']
          # Same bytes as glsd301p-stock-bank-a.bin in the Gledopto recovery kit.
          if image['sha256'] != os.environ['GLEDOPTO_IMAGE_SHA256']:
              sys.exit(f'GL-SD-301P image differs from the Gledopto kit: {image}')
          print('GL-SD-301P stock image matches the Gledopto kit:', image['sha256'])
          EOF
      - name: Prepare every released board image from the committed OTA index
        shell: bash
        run: |
          set -euo pipefail
          python3 helper_scripts/telink_swire_recovery.py boards --index zigbee2mqtt/ota/index_router.json \
            --search 4rbqgcuv --json > "$RUNNER_TEMP/boards.json"
          python3 helper_scripts/telink_swire_recovery.py prepare --device bseed-ts0726 \
            --index zigbee2mqtt/ota/index_bseed.json --out "$RUNNER_TEMP/index-kits/bseed-ts0726" --json \
            > "$RUNNER_TEMP/ts0726.json"
          python3 - "$RUNNER_TEMP" <<'EOF'
          import json, pathlib, sys
          import yaml
          sys.path.insert(0, 'helper_scripts')
          import telink_swire_recovery as tool
          root = pathlib.Path(sys.argv[1])
          found = [row['board'] for row in json.loads((root / 'boards.json').read_text())['boards']]
          if found != ['MODULE_AVATTO_A_TS0001']:
              sys.exit(f'boards --search 4rbqgcuv found {found}')
          db = yaml.safe_load(open('device_db.yaml', encoding='utf-8'))
          ts0726 = json.loads((root / 'ts0726.json').read_text())['plan']
          if ts0726['image']['imageType'] != db['SWITCH_BSEED_TS0726_3GANG']['firmware_image_type']:
              sys.exit('TS0726 3-gang image type differs from device_db.yaml')
          summary = {'bundled': 0, 'refusedSilabs': 0, 'refusedGated': 0}
          for role in tool.ROLES:
              index = pathlib.Path('zigbee2mqtt/ota') / tool.INDEX_FILES[role]
              for row in tool.board_list(json.loads(index.read_text()), role):
                  board = row['board']
                  entry = db.get(board) or {}
                  if not entry:
                      print(f'note: {board} is in {index.name} but not in device_db.yaml')
                  out = root / 'index-kits' / role / board
                  try:
                      plan = tool.prepare(out=out, device='tuya-zigbee-switch', board=board, role=role,
                                          index=index)
                  except tool.RecoveryError as error:
                      telink = str(entry.get('mcu_family')) == 'Telink'
                      gated = board.startswith(('OUTLET_BSEED', 'SWITCH_BSEED_TS0726_3GANG'))
                      if gated and 'gated' in str(error):
                          summary['refusedGated'] += 1
                      elif not telink and 'Silicon Labs' in str(error):
                          summary['refusedSilabs'] += 1
                      else:
                          sys.exit(f'{role} {board} ({entry.get("mcu")}): {error}')
                      continue
                  if entry and str(entry.get('mcu_family')) != 'Telink':
                      sys.exit(f'{board} is not Telink but produced a bundle')
                  expected = entry.get('firmware_image_type')
                  if role == 'router' and expected and plan['image']['imageType'] != expected:
                      sys.exit(f'{board} image type {plan["image"]["imageType"]} differs from device_db {expected}')
                  summary['bundled'] += 1
          if summary['bundled'] < 150:
              sys.exit(f'too few bundles: {summary}')
          print('Released index images:', summary)
          EOF
      - name: Package stock recovery tool and guide
        run: |
          cp helper_scripts/telink_swire_recovery.py "$RUNNER_TEMP/gledopto-kit/"
          sed "s|(\.\./\.\./|(https://github.com/analienx/tuya-zigbee-switch/blob/$(git rev-parse HEAD)/|g;s|(swire/AGENTS.md)|(AGENTS.md)|g" docs/flashing/swire_recovery.md > "$RUNNER_TEMP/gledopto-kit/README.md"
          sed "s|(\.\./swire_recovery\.md)|(README.md)|g;s|(\.\./swire_recovery_review\.md)|(swire_recovery_review.md)|g;s|(\.\./\.\./\.\./|(https://github.com/analienx/tuya-zigbee-switch/blob/$(git rev-parse HEAD)/|g" docs/flashing/swire/AGENTS.md > "$RUNNER_TEMP/gledopto-kit/AGENTS.md"
          cp docs/flashing/swire_recovery_review.md "$RUNNER_TEMP/gledopto-kit/"
      - name: Validate the original hosted r19 rollback artifact when requested
        if: github.event_name == 'workflow_dispatch' && inputs.r19_artifact_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          R19_RUN: ${{ inputs.r19_artifact_run }}
        run: |
          set -euo pipefail
          [[ "$R19_RUN" =~ ^[0-9]+$ ]]
          test "$(gh api repos/analienx/tuya-zigbee-switch/actions/runs/$R19_RUN --jq .head_sha)" = 1cc08a92d4dd68ff3607dc224f707c3e757d4ec8
          gh run download "$R19_RUN" --repo analienx/tuya-zigbee-switch -n bseed-pm-role-matrix-1cc08a92d4dd68ff3607dc224f707c3e757d4ec8 -D "$RUNNER_TEMP/r19-original"
          python3 - "$RUNNER_TEMP/r19-original" "$RUNNER_TEMP/r19-kit" <<'EOF'
          import hashlib, pathlib, sys
          sys.path.insert(0, 'helper_scripts')
          import telink_swire_recovery as tool
          matches = [p for p in pathlib.Path(sys.argv[1]).rglob('forward.ota')
                     if hashlib.sha256(p.read_bytes()).hexdigest() == tool.R19_RECOVERY['otaSha256']]
          if len(matches) != 1:
              sys.exit('Original artifact does not contain exactly one pinned r19 OTA')
          plan = tool.prepare(matches[0], pathlib.Path(sys.argv[2]), device='bseed-ts011f-pm-r19-recovery')
          if plan['image']['sha256'] != tool.R19_RECOVERY['sha256']:
              sys.exit('Native r19 rollback SHA mismatch')
          print('Original hosted r19 finalized payload matches the pinned rollback profile')
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: gledopto-stock-wired-kit-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/gledopto-kit/
