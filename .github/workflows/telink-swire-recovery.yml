name: Telink SWire recovery tool

on:
  workflow_dispatch:
    inputs:
      r19_artifact_run:
        description: 'Optional original r19 PM matrix run to validate the historical rollback bytes'
        required: false
        default: ''
  push:
    paths:
      - 'helper_scripts/telink_swire_recovery.py'
      - 'tests/test_telink_swire_recovery.py'
      - '.github/workflows/telink-swire-recovery.yml'
  pull_request:
    paths:
      - 'helper_scripts/telink_swire_recovery.py'
      - 'tests/test_telink_swire_recovery.py'
      - '.github/workflows/telink-swire-recovery.yml'

permissions:
  contents: read
  actions: read

jobs:
  windows-agent-contract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python -m pytest --noconftest tests/test_telink_swire_recovery.py -v

  swire-tool:
    runs-on: ubuntu-latest
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      # analienx/gledopto recovery branch; its kit pins the same stock image.
      GLEDOPTO_COMMIT: 895567036301d25da68161358f96a37971488a08
      GLEDOPTO_OTA_SHA256: 16595a38ab9783d3afc4eb58ab4ec32625249bd569c1fa6dbaf468bddc76dd72
      GLEDOPTO_IMAGE_SHA256: 7ba122f1ebc9f6ec419d9ea6b27676d55c2a2aad864a03e90b896546248c4b48
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Prove exact candidate head
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Install pytest
        run: sudo apt-get update && sudo apt-get install -y python3-pytest

      - name: Run the tool against the chip and flash model
        run: python3 -m pytest --noconftest tests/test_telink_swire_recovery.py -v

      - name: Verify pinned upstream reader provenance
        run: |
          curl --fail --location -o "$RUNNER_TEMP/reader.py" https://raw.githubusercontent.com/pvvx/TlsrComSwireWriter/042613b1b47a1598856b0ff3e8a133f2918798a5/TLSR825xComFlasher.py
          echo "2ea1b7c5266821e5d384a263daa7916bb4020fcdfb8f1ec0bed5842dcb94ca18  $RUNNER_TEMP/reader.py" | sha256sum --check

      - name: Prepare the GL-SD-301P stock OTA and match the Gledopto kit
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/stock.ota" \
            "https://raw.githubusercontent.com/analienx/gledopto/$GLEDOPTO_COMMIT/devices/gl-sd-301p/vendor-firmware/originals/GL-SD-301P_V20851203_20251230.ota"
          python3 helper_scripts/telink_swire_recovery.py prepare --ota "$RUNNER_TEMP/stock.ota" \
            --device gledopto-gl-sd-301p --out "$RUNNER_TEMP/gledopto-kit" --expect-ota-sha256 "$GLEDOPTO_OTA_SHA256"
          python3 - "$RUNNER_TEMP/gledopto-kit/plan.json" <<'EOF'
          import json, os, sys
          image = json.load(open(sys.argv[1]))['image']
          # Same bytes as glsd301p-stock-bank-a.bin in the Gledopto recovery kit.
          if image['sha256'] != os.environ['GLEDOPTO_IMAGE_SHA256']:
              sys.exit(f'GL-SD-301P image differs from the Gledopto kit: {image}')
          print('GL-SD-301P stock image matches the Gledopto kit:', image['sha256'])
          EOF
      - name: Package stock recovery tool and guide
        run: |
          cp helper_scripts/telink_swire_recovery.py "$RUNNER_TEMP/gledopto-kit/"
          sed "s|(\.\./\.\./|(https://github.com/analienx/tuya-zigbee-switch/blob/$(git rev-parse HEAD)/|g" docs/flashing/swire_recovery.md > "$RUNNER_TEMP/gledopto-kit/README.md"
          cp docs/flashing/swire_recovery_review.md "$RUNNER_TEMP/gledopto-kit/"
      - name: Validate the original hosted r19 rollback artifact when requested
        if: github.event_name == 'workflow_dispatch' && inputs.r19_artifact_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          R19_RUN: ${{ inputs.r19_artifact_run }}
        run: |
          set -euo pipefail
          [[ "$R19_RUN" =~ ^[0-9]+$ ]]
          test "$(gh api repos/analienx/tuya-zigbee-switch/actions/runs/$R19_RUN --jq .head_sha)" = 1cc08a92d4dd68ff3607dc224f707c3e757d4ec8
          gh run download "$R19_RUN" --repo analienx/tuya-zigbee-switch -n bseed-pm-role-matrix-1cc08a92d4dd68ff3607dc224f707c3e757d4ec8 -D "$RUNNER_TEMP/r19-original"
          python3 - "$RUNNER_TEMP/r19-original" "$RUNNER_TEMP/r19-kit" <<'EOF'
          import hashlib, pathlib, sys
          sys.path.insert(0, 'helper_scripts')
          import telink_swire_recovery as tool
          matches = [p for p in pathlib.Path(sys.argv[1]).rglob('forward.ota')
                     if hashlib.sha256(p.read_bytes()).hexdigest() == tool.R19_RECOVERY['otaSha256']]
          if len(matches) != 1:
              sys.exit('Original artifact does not contain exactly one pinned r19 OTA')
          plan = tool.prepare(matches[0], pathlib.Path(sys.argv[2]), device='bseed-ts011f-pm-r19-recovery')
          if plan['image']['sha256'] != tool.R19_RECOVERY['sha256']:
              sys.exit('Native r19 rollback SHA mismatch')
          print('Original hosted r19 finalized payload matches the pinned rollback profile')
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: gledopto-stock-wired-kit-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/gledopto-kit/
