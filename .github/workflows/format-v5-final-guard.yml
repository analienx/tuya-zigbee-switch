name: format-v5-final-guard

on:
  push:
    branches:
      - supervisor/ts0726-redesign-v5

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: supervisor/ts0726-redesign-v5
      - name: Install exact formatter
        run: |
          sudo apt-get update
          sudo apt-get install -y uncrustify=0.78.1+dfsg1-1
      - name: Format final guard
        run: |
          uncrustify -c uncrustify.cfg --replace --no-backup src/device_config/config_nv.c
          git diff --check
      - name: Commit formatter output
        run: |
          git config user.name "Supervisor formatter"
          git config user.email "actions@github.com"
          git add src/device_config/config_nv.c
          if git diff --cached --quiet; then
            echo "No formatting changes"
          else
            git commit -m "style: format v5 config guard"
            git push origin HEAD:supervisor/ts0726-redesign-v5
          fi
