name: BSEED PM recovery v12053003

on:
  workflow_dispatch:
  push:
    branches:
      - supervisor/v8-pm-recovery-v12053003

jobs:
  build-and-prove-recovery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact recovery source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Assert immutable V8 base and recovery-only source scope
        shell: bash
        run: |
          set -euo pipefail
          BASE=ded91a1fb1cdeb320d0858c8f4bcabab32bf5564
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --check "$BASE"..HEAD
          git diff --name-only "$BASE"..HEAD | sort > "$RUNNER_TEMP/recovery-changed-files.txt"
          cat > "$RUNNER_TEMP/recovery-allowed-files.txt" <<'EOF'
          .github/workflows/pm-recovery-v12053003.yml
          make_scripts/build_bseed_ts011f_pm_recovery.sh
          make_scripts/validate_bseed_ts011f_pm_recovery.py
          src/base_components/energy_measurement/hlw8012.c
          tests/test_bseed_pm_recovery_contract.py
          EOF
          sort -o "$RUNNER_TEMP/recovery-allowed-files.txt" "$RUNNER_TEMP/recovery-allowed-files.txt"
          diff -u "$RUNNER_TEMP/recovery-allowed-files.txt" "$RUNNER_TEMP/recovery-changed-files.txt"
          git diff "$BASE"..HEAD -- \
            src/base_components/energy_measurement/hlw8012.c \
            make_scripts/build_bseed_ts011f_pm_recovery.sh \
            make_scripts/validate_bseed_ts011f_pm_recovery.py \
            tests/test_bseed_pm_recovery_contract.py \
            .github/workflows/pm-recovery-v12053003.yml \
            > "$RUNNER_TEMP/recovery-source-diff.patch"

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make python3 python3-pytest python3-yaml curl wget unzip bzip2

      - name: Cache pinned Telink SDK and toolchain
        uses: actions/cache@v4
        with:
          path: telink_tools
          key: telink-tools-v3.7.2.0

      - name: Install Telink build dependencies only
        run: make -C src/telink -f tools.mk sdk toolchain

      - name: Record exact build environment
        shell: bash
        run: |
          set -euo pipefail
          TC32=./telink_tools/toolchain/tc32/bin/tc32-elf-gcc
          {
            echo "head=$(git rev-parse HEAD)"
            echo "base=ded91a1fb1cdeb320d0858c8f4bcabab32bf5564"
            echo "status_begin"
            git status --porcelain
            echo "status_end"
            echo "python=$(python3 --version 2>&1)"
            echo "make=$(make --version | head -1)"
            "$TC32" --version | head -1
            sha256sum telink_tools/downloads/tc32_gcc_v2.0.tar.bz2
          } > "$RUNNER_TEMP/recovery-build-environment.txt"

      - name: Validate normal V8 identity and build recovery twice
        shell: bash
        run: |
          set -euo pipefail
          python3 make_scripts/validate_bseed_ts011f_pm_recovery.py \
            2>&1 | tee "$RUNNER_TEMP/recovery-validator-output.log"

      - name: Final artifact assertions
        shell: bash
        run: |
          set -euo pipefail
          test -s build/bseed-ts011f-pm-recovery-a/forward.bin
          test -s build/bseed-ts011f-pm-recovery-a/forward.ota
          test -s build/bseed-ts011f-pm-recovery-a/manifest.json
          test -s build/bseed-ts011f-pm-recovery-b/forward.bin
          test -s build/bseed-ts011f-pm-recovery-b/forward.ota
          test -s build/bseed-ts011f-pm-recovery-validation.json
          cmp build/bseed-ts011f-pm-recovery-a/forward.bin build/bseed-ts011f-pm-recovery-b/forward.bin
          cmp build/bseed-ts011f-pm-recovery-a/forward.ota build/bseed-ts011f-pm-recovery-b/forward.ota
          sha256sum \
            build/bseed-ts011f-pm-recovery-a/forward.bin \
            build/bseed-ts011f-pm-recovery-a/forward.ota \
            build/bseed-ts011f-pm-recovery-b/forward.bin \
            build/bseed-ts011f-pm-recovery-b/forward.ota \
            > "$RUNNER_TEMP/recovery-sha256.txt"
          sha512sum \
            build/bseed-ts011f-pm-recovery-a/forward.bin \
            build/bseed-ts011f-pm-recovery-a/forward.ota \
            > "$RUNNER_TEMP/recovery-sha512.txt"

      - name: Upload immutable recovery build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bseed-pm-recovery-v12053003
          retention-days: 30
          path: |
            ${{ runner.temp }}/recovery-build-environment.txt
            ${{ runner.temp }}/recovery-validator-output.log
            ${{ runner.temp }}/recovery-changed-files.txt
            ${{ runner.temp }}/recovery-source-diff.patch
            ${{ runner.temp }}/recovery-sha256.txt
            ${{ runner.temp }}/recovery-sha512.txt
            build/bseed-ts011f-pm-v8/forward.ota
            build/bseed-ts011f-pm-v8/manifest.json
            build/bseed-ts0726-v8/manifest.json
            build/bseed-ts011f-pm-recovery-a/forward.bin
            build/bseed-ts011f-pm-recovery-a/forward.ota
            build/bseed-ts011f-pm-recovery-a/manifest.json
            build/bseed-ts011f-pm-recovery-b/forward.bin
            build/bseed-ts011f-pm-recovery-b/forward.ota
            build/bseed-ts011f-pm-recovery-b/manifest.json
            build/bseed-ts011f-pm-recovery-validation.json
          if-no-files-found: warn
