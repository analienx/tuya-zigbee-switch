name: BSEED PM recovery1 reproducibility

on:
  workflow_dispatch:
  push:
    branches:
      - supervisor/v8-pm-known-good-recovery1

jobs:
  validate-recovery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact recovery source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make python3 python3-pytest python3-yaml curl wget unzip bzip2

      - name: Cache pinned Telink SDK and toolchain
        uses: actions/cache@v4
        with:
          path: telink_tools
          key: telink-tools-v3.7.2.0

      - name: Install Telink build dependencies only
        run: make -C src/telink -f tools.mk sdk toolchain

      - name: Record immutable build environment
        shell: bash
        run: |
          set -euo pipefail
          TC32=./telink_tools/toolchain/tc32/bin/tc32-elf-gcc
          {
            echo "head=$(git rev-parse HEAD)"
            echo "base=ded91a1fb1cdeb320d0858c8f4bcabab32bf5564"
            echo "status_begin"
            git status --porcelain
            echo "status_end"
            echo "python=$(python3 --version 2>&1)"
            echo "make=$(make --version | head -1)"
            "$TC32" --version | head -1
            sha256sum telink_tools/downloads/tc32_gcc_v2.0.tar.bz2
          } > "$RUNNER_TEMP/pm-recovery1-build-environment.txt"

      - name: Validate V8 control, deterministic recovery and TS0726 regression
        shell: bash
        run: |
          set -euo pipefail
          python3 make_scripts/validate_bseed_ts011f_pm_recovery1.py \
            2>&1 | tee "$RUNNER_TEMP/pm-recovery1-validator.log"

      - name: Upload immutable recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bseed-pm-recovery1-reproducibility
          path: |
            ${{ runner.temp }}/pm-recovery1-validator.log
            ${{ runner.temp }}/pm-recovery1-build-environment.txt
            build/bseed-pm-recovery1-evidence/validation-summary.json
            build/bseed-pm-recovery1-evidence/recovery-a/forward.bin
            build/bseed-pm-recovery1-evidence/recovery-a/forward.ota
            build/bseed-pm-recovery1-evidence/recovery-a/manifest.json
            build/bseed-pm-recovery1-evidence/recovery-b/forward.bin
            build/bseed-pm-recovery1-evidence/recovery-b/forward.ota
            build/bseed-pm-recovery1-evidence/recovery-b/manifest.json
          if-no-files-found: warn
