name: BSEED r21 boot forensics

on:
  push:
    branches: [diag/bseed-r21-boot-20261106]

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - build: r19
            sha: 1cc08a92d4dd68ff3607dc224f707c3e757d4ec8
            ota_sha: d17571a1d996ff798f1b6334cac1d799fbc1c6125a0212741aca89446053fc95
          - build: r21
            sha: b28624d80b4f3c419954239de2c919a2cf53f1a1
            ota_sha: 9be8010d4f85e31a378a85bb159860dcccf2febd2a398b32f7f2dda4cc4f70fb
          - build: r21-no-jump-tables
            sha: b28624d80b4f3c419954239de2c919a2cf53f1a1
            ota_sha: 9be8010d4f85e31a378a85bb159860dcccf2febd2a398b32f7f2dda4cc4f70fb
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/cache@v4
        with:
          path: telink_tools
          key: telink-tools-v3.7.2.0
      - name: Reproduce deployed OTA image
        env:
          SOURCE_SHA: ${{ matrix.sha }}
          OTA_SHA: ${{ matrix.ota_sha }}
          BSEED_PM_CONSOLIDATED: '1'
          BSEED_PM_CONSOLIDATED_OUTPUT: build/forensics
        run: |
          set -euo pipefail
          git checkout -q --detach "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          make -C src/telink -f tools.mk sdk toolchain
          bash make_scripts/build_bseed_ts011f_pm_v8.sh
          printf '%s  %s\n' "$OTA_SHA" build/forensics/forward.ota | sha256sum -c -
      - name: Rebuild with jump tables disabled for diagnosis
        if: matrix.build == 'r21-no-jump-tables'
        env:
          BSEED_PM_CONSOLIDATED: '1'
          BSEED_PM_CONSOLIDATED_OUTPUT: build/forensics
        run: |
          set -euo pipefail
          sed -i 's/^    OPT_LEVEL=-Os$/    OPT_LEVEL="-Os -fno-jump-tables"/' make_scripts/build_bseed_ts011f_pm_v8.sh
          grep -F -- '-Os -fno-jump-tables' make_scripts/build_bseed_ts011f_pm_v8.sh
          bash make_scripts/build_bseed_ts011f_pm_v8.sh
      - name: Record actual boot and flash code
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/boot"
          objdump=telink_tools/toolchain/tc32/bin/tc32-elf-objdump
          elf=build/telink/tlc_switch.elf
          "$objdump" -h -t "$elf" > "$RUNNER_TEMP/boot/layout.txt"
          "$objdump" -d "$elf" > "$RUNNER_TEMP/boot/disassembly.txt"
          cp build/telink/profile-macros.txt "$RUNNER_TEMP/boot/"
          python3 - <<'PY' | tee "$RUNNER_TEMP/boot/native-header.txt"
          from pathlib import Path
          from struct import unpack_from

          image = Path("build/forensics/forward.ota").read_bytes()
          payload = image[62:]
          for offset in (0, 4, 8, 12, 0x18, 0x8008, 0x20008):
              print(f"offset {offset:#07x} = {unpack_from('<I', payload, offset)[0]:#010x}")
          print(f"OTA bytes: {len(image)}; payload bytes: {len(payload)}")
          if len(image) > 0x34000 or unpack_from("<I", payload, 0x18)[0] != len(payload):
              raise ValueError("Telink image exceeds OTA limit or has an invalid native size")
          if unpack_from("<I", payload, 8)[0] != 0x544c4e4b or any(
              unpack_from("<I", payload, offset)[0] == 0x544c4e4b
              for offset in (0x8008, 0x20008)
          ):
              raise ValueError("Invalid Telink boot marker layout")
          PY
      - name: Compare cold boot from both slots in TC32 model
        env:
          TC32EMU_FLASH_SIZE: '0x80000'
          EMU_REV: 2e1bcaed762e3124b024047db981172d2b0395ba
          BUILD_ID: ${{ matrix.build }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone -q https://github.com/goyamamoto/tc32-devtools.git "$RUNNER_TEMP/tc32"
          git -C "$RUNNER_TEMP/tc32" checkout -q --detach "$EMU_REV"
          if [ "$BUILD_ID" = r19 ]; then
            gh run download 42185667875 -R analienx/tuya-zigbee-switch \
              -n bseed-flash-candidates-b28624d80b4f3c419954239de2c919a2cf53f1a1 \
              -D "$RUNNER_TEMP/r21"
            printf '%s  %s\n' 9be8010d4f85e31a378a85bb159860dcccf2febd2a398b32f7f2dda4cc4f70fb \
              "$RUNNER_TEMP/r21/pm-router/firmware.ota" | sha256sum -c -
          fi
          PYTHONPATH="$RUNNER_TEMP/tc32/emulator" python3 - <<'PY' | tee "$RUNNER_TEMP/boot/cold-boot.txt"
          import re
          import os
          from pathlib import Path

          import tc32emu as te

          image = Path("build/forensics/forward.ota").read_bytes()[62:]
          layout = (Path(os.environ["RUNNER_TEMP"]) / "boot/layout.txt").read_text()
          symbols = {
              name: int(addr, 16)
              for addr, name in re.findall(
                  r"^([0-9a-f]{8})[ \t]+[lgw][ \t]+(?:[FO][ \t]+)?"
                  r"\.[\w.]+[ \t]+[0-9a-f]+[ \t]+(\S+)$", layout, re.M
              )
          }

          def skip_stack_paint(machine):
              # Both SDK images fill the unused stack from an unaligned symbol.
              # The model rejects the store. Skip only that diagnostic fill.
              machine.r[15] = symbols["COPY_DATA"]

          def run(machine, cycles=4_000_000):
              try:
                  return machine.run(machine.cycles + cycles)
              except (te.EmuError, te.SoftwareReset, te.WatchdogReset, te.Stop) as error:
                  return f"{type(error).__name__}: {error}"

          milestones = (
              "main", "drv_platform_init", "flash_vdd_f_calib", "ensure_correct_ota_scheme",
              "real_main", "os_init", "app_init", "handle_version_changes",
              "migrate_legacy_bseed_pm_nvm", "parse_config", "hal_gpio_init",
              "hal_gpio_callback", "hal_zigbee_init", "bdb_init", "hal_zigbee_init_ota",
              "drv_wd_start", "bdb_init_callback", "app_task",
              "telink_zigbee_hal_router_recovery_tick", "telink_zigbee_hal_telemetry_tick",
              "hal_telink_counter_fault", "tl_printf",
          )
          for slot, bypass_crystal_wait in ((0, False), (0, True), (0x40000, True)):
              flash = te.Flash()
              flash.mem[slot:slot + len(image)] = image
              machine = te.Machine(flash, boot_slot=slot, symbols=symbols, cpi=3)
              seen = set()

              def observe(m, name):
                  if name not in seen:
                      seen.add(name)
                      print(f"{name} at 0x{m.r[15]:05x}, {m.ms():.3f} ms")

              for name in milestones:
                  if name in symbols:
                      machine.hooks[symbols[name]] = lambda m, name=name: observe(m, name)

              machine.hooks[symbols["FLL_STK"]] = skip_stack_paint
              if bypass_crystal_wait:
                  # Both images reset inside the shared SDK crystal probe in
                  # this TLSR8278 timing model. Model a running system timer
                  # and assume that the crystal probe succeeds.
                  def crystal_ready(m):
                      m.reg_write(0x74a, 1, 0xc3)
                      m.r[15] = m.r[14] & ~1
                  machine.hooks[symbols["pm_wait_xtal_ready"]] = crystal_ready
              print(f"Simulating slot {slot:#07x}, empty NVM, stack paint skipped, crystal probe bypass={bypass_crystal_wait}")
              reason = run(machine)
              print(f"Stopped at {machine.symbolize(machine.r[15])}: {reason}")
              print(f"Local GPIO initialized: {'hal_gpio_init' in seen}; application loop: {'app_task' in seen}")
              if bypass_crystal_wait and os.environ["BUILD_ID"] == "r21-no-jump-tables":
                  if not {"hal_gpio_callback", "drv_wd_start", "app_task"} <= seen:
                      raise RuntimeError("Compiler workaround did not reach the application loop")

          for deny_counter_writes in (False, True):
              flash = te.Flash()
              flash.mem[:len(image)] = image
              if deny_counter_writes:
                  flash.protected = lambda addr, size: addr < 0x3e000 and addr + size > 0x3c000
              machine = te.Machine(flash, symbols=symbols)
              machine.reg_write(0x74a, 1, 0xc3)  # boot enables the system timer before NVM calls
              machine.r[13] = 0x850000
              machine.r[14] = 0x1fe
              machine.r[0] = 8192
              machine.r[15] = symbols["nv_nwkFrameCountSaveToFlash"]
              reached = []

              def returned(m):
                  reached.append(f"returned status {m.r[0]}")
                  raise te.Stop("return to caller")

              def fault(m):
                  reached.append(f"entered hal_telink_counter_fault with status {m.r[0]}")

              machine.hooks[0x1fe] = returned
              machine.hooks[symbols["hal_telink_counter_fault"]] = fault
              reason = run(machine, 250_000)
              print(f"Counter commit with deny_writes={deny_counter_writes}: {reached}")
              print(f"Stopped at {machine.symbolize(machine.r[15])}: {reason}")

          if os.environ["BUILD_ID"] == "r19":
              r21 = (Path(os.environ["RUNNER_TEMP"]) / "r21/pm-router/firmware.ota").read_bytes()[62:]
              for old_slot, new_slot in ((0, 0x40000), (0x40000, 0)):
                  flash = te.Flash()
                  flash.mem[old_slot:old_slot + len(image)] = image
                  flash.mem[new_slot:new_slot + len(r21)] = r21
                  flash.mem[new_slot + 8] = 0xff  # SDK leaves new flag unset during transfer
                  machine = te.Machine(flash, boot_slot=old_slot, symbols=symbols)
                  machine.reg_write(0x74a, 1, 0xc3)
                  machine.write(symbols["mcuBootAddr"], 4, old_slot)
                  machine.r[13] = 0x850000
                  machine.r[14] = 0x1fe
                  machine.hooks[0x1fe] = returned
                  machine.r[15] = symbols["ota_mcuReboot"]
                  reason = run(machine, 30_000_000)
                  old_marker = flash.mem[old_slot + 8]
                  new_marker = flash.mem[new_slot + 8]
                  print(f"OTA activate {old_slot:#07x} -> {new_slot:#07x}: {reason}")
                  print(f"Old marker={old_marker:#04x}; new marker={new_marker:#04x}")
                  if (old_marker, new_marker) == (0, 0x4b):
                      machine.reset()
                      print(f"Model reselected slot {machine.boot_slot:#07x} after reset")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bseed-boot-forensics-${{ matrix.build }}
          path: ${{ runner.temp }}/boot
          if-no-files-found: error
