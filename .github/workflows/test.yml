name: test

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Install uncrustify
        run: sudo apt-get update && sudo apt-get install -y uncrustify
      - name: Check changed C code formatting
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            base='${{ github.event.pull_request.base.sha }}'
          else
            base='${{ github.event.before }}'
            if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
              base="HEAD^"
            fi
          fi

          mapfile -t files < <(git diff --name-only "$base" HEAD -- src | grep -E '\.(c|h)$' || true)
          if (( ${#files[@]} == 0 )); then
            echo "No changed C/header files to lint"
            exit 0
          fi

          if uncrustify -c uncrustify.cfg --check "${files[@]}"; then
            exit 0
          fi

          # The runner copy is disposable. Format it to produce both an exact
          # patch and the canonical full source files for supervisor-owned
          # remediation; nothing is pushed from CI.
          uncrustify -c uncrustify.cfg --replace --no-backup "${files[@]}"
          git diff -- "${files[@]}" | tee lint-diff.patch
          mkdir -p lint-formatted
          for file in "${files[@]}"; do
            mkdir -p "lint-formatted/$(dirname "$file")"
            cp "$file" "lint-formatted/$file"
          done
          exit 1
      - name: Upload lint diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-diagnostics
          path: |
            lint-diff.patch
            lint-formatted/
          if-no-files-found: ignore

  image-type-identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Install YAML parser
        run: sudo apt-get update && sudo apt-get install -y python3-yaml
      - name: Reject new or changed firmware image-type collisions
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            base='${{ github.event.pull_request.base.sha }}'
          else
            base='${{ github.event.before }}'
            if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
              base="HEAD^"
            fi
          fi
          python3 helper_scripts/check_image_types.py device_db.yaml --changed-base "$base"

  bseed-identity-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Gate checked-in images against the identity registry
        shell: bash
        run: |
          set -euo pipefail
          make bseed/identity-gate

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install pytests and converter dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make python3 python3-pytest python3-yaml python3-jinja2 python3-paho-mqtt python3-paramiko
      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          make tests 2>&1 | tee test-output.log
      - name: Generate converter canary artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p converter-canary
          python3 helper_scripts/make_z2m_custom_converters.py device_db.yaml > converter-canary/switch_custom.js
          python3 helper_scripts/make_z2m_custom_converters.py --z2m-v1 device_db.yaml > converter-canary/switch_custom_z2m_v1.js
          node --check converter-canary/switch_custom.js
          node --check converter-canary/switch_custom_z2m_v1.js
          sha256sum converter-canary/switch_custom.js converter-canary/switch_custom_z2m_v1.js | tee converter-canary/SHA256SUMS
          diff -u zigbee2mqtt/converters/switch_custom.js converter-canary/switch_custom.js > converter-canary/current-vs-generated.patch || true
      - name: Upload converter canary
        uses: actions/upload-artifact@v4
        with:
          name: z2m-converter-canary-${{ github.sha }}
          path: converter-canary/
          if-no-files-found: error
      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics
          path: test-output.log
          if-no-files-found: error
