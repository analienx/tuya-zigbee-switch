name: test

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install uncrustify
        run: sudo apt-get update && sudo apt-get install -y uncrustify
      - name: Check code formatting
        run: |
          find src -name '*.c' -o -name '*.h' | xargs uncrustify -c uncrustify.cfg --check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install pytests and converter generator dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make python3 python3-pip
          python3 -m pip install --break-system-packages pytest pyyaml jinja2 || python3 -m pip install pytest pyyaml jinja2
      - name: Run tests
        run: make tests
