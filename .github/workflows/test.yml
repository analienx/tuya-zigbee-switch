name: test

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install uncrustify
        run: sudo apt-get update && sudo apt-get install -y uncrustify
      - name: Check code formatting
        run: |
          find src -name '*.c' -o -name '*.h' | xargs uncrustify -c uncrustify.cfg --check

  image-type-identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Install YAML parser
        run: sudo apt-get update && sudo apt-get install -y python3-yaml
      - name: Reject new or changed firmware image-type collisions
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            base='${{ github.event.pull_request.base.sha }}'
          else
            base='${{ github.event.before }}'
            if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
              base="HEAD^"
            fi
          fi
          python3 helper_scripts/check_image_types.py device_db.yaml --changed-base "$base"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install pytests
        run: |
          sudo apt-get update
          sudo apt-get install -y make python3 python3-pytest python3-yaml
      - name: Run tests
        run: make tests
