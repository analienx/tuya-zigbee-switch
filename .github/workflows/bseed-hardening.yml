name: BSEED shared hardening

on:
  push:
    branches: ['codex/bseed-shared-hardening']
  pull_request:

jobs:
  allocation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Replay allocation while preserving sealed and retired identities
        run: |
          python3 - <<'PY'
          import runpy
          suite = runpy.run_path('tests/test_bseed_candidate_allocation.py')
          suite['test_candidates_follow_canonical_board_allocator']()
          suite['test_retired_pm_return_tuple_stays_reserved_without_being_a_candidate']()
          print('Canonical socket allocation and retired-tuple reservations verified')
          PY
      - name: Allocate next recovery identities
        run: |
          set -euo pipefail
          python3 helper_scripts/bseed_ota_identity.py emit-make-vars --image-type 43556 --version-str 1.2.5-bseedr21
          python3 helper_scripts/bseed_ota_identity.py emit-make-vars --image-type 65024 --version-str 1.2.5-bseedcli24
          python3 helper_scripts/bseed_ota_identity.py emit-make-vars --image-type 43555 --version-str 1.1.3-bseedr19
          python3 helper_scripts/bseed_ota_identity.py emit-make-vars --image-type 65026 --version-str 1.1.3-bseedc17
          python3 helper_scripts/bseed_ota_identity.py emit-make-vars --image-type 45577 --version-str 1.1.9-bseedrv3
          python3 helper_scripts/bseed_ota_identity.py emit-make-vars --image-type 65025 --version-str 1.1.8-bseedcli5
